<section id="ssv-widget-hero" aria-labelledby="ssv-widget-hero-title">
  <style>
    #ssv-widget-hero{--ssv-blue:#0076DF;--ssv-navy:#071A49;--ssv-muted:#5F6368;--ssv-border:#E5E7EB;--ssv-soft:#F7F8FA;background:#fff;color:var(--ssv-navy);font-family:Lato,Arial,sans-serif}
    #ssv-widget-hero *{box-sizing:border-box}#ssv-widget-hero a{color:inherit;text-decoration:none}
    #ssv-widget-hero .ssv-wrap{max-width:1200px;margin:0 auto;padding:0 48px}
    #ssv-widget-hero .ssv-header{display:flex;align-items:center;justify-content:space-between;min-height:82px;border-bottom:1px solid var(--ssv-border);gap:24px}
    #ssv-widget-hero .ssv-logo{width:212px;height:auto;display:block}
    #ssv-widget-hero nav{display:flex;align-items:center;gap:27px;font-size:14px;color:var(--ssv-navy)}
    #ssv-widget-hero nav a:hover{color:var(--ssv-blue)}
    #ssv-widget-hero .ssv-cta{display:inline-flex;align-items:center;gap:12px;background:var(--ssv-blue);border-radius:999px;color:#fff;padding:14px 22px;font-size:14px;font-weight:500;white-space:nowrap;transition:background 220ms ease,transform 220ms ease}
    #ssv-widget-hero .ssv-cta:hover{background:#0068c6;transform:translateY(-1px)}
    #ssv-widget-hero .ssv-hero{display:grid;grid-template-columns:1fr 1fr;min-height:540px;align-items:center}
    #ssv-widget-hero .ssv-copy{padding:76px 28px 76px 0}
    #ssv-widget-hero .ssv-eyebrow{margin:0 0 20px;color:var(--ssv-blue);font-size:11px;letter-spacing:.28em;text-transform:uppercase}
    #ssv-widget-hero h1{max-width:520px;margin:0;font-size:50px;line-height:1.08;font-weight:300;letter-spacing:-.04em}
    #ssv-widget-hero h1 span{color:var(--ssv-blue)}
    #ssv-widget-hero .ssv-lede{max-width:475px;margin:22px 0 30px;color:var(--ssv-muted);font-size:17px;line-height:1.65}
    #ssv-widget-hero .ssv-actions{display:flex;align-items:center;gap:24px;flex-wrap:wrap}.ssv-secondary{color:var(--ssv-blue)!important;font-size:14px;font-weight:500}.ssv-secondary span{font-size:20px;margin-left:7px;vertical-align:-1px}
    #ssv-widget-hero .ssv-visual{align-self:stretch;min-height:540px;background:linear-gradient(105deg,#fafdff 0%,#edf6fb 100%);position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
    #ssv-widget-hero .ssv-visual:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.8),transparent 35%);pointer-events:none}
    #ssv-widget-hero .ssv-family{width:100%;height:100%;object-fit:cover;object-position:center;mix-blend-mode:multiply;opacity:.92}
    #ssv-widget-hero .ssv-note{position:absolute;right:34px;top:95px;z-index:1;color:var(--ssv-blue);font-family:cursive;font-size:28px;line-height:1.05;transform:rotate(-7deg)}
    #ssv-widget-hero .ssv-mobile{display:none}
    @media(max-width:900px){#ssv-widget-hero .ssv-wrap{padding:0 32px}#ssv-widget-hero nav{gap:14px;font-size:13px}#ssv-widget-hero h1{font-size:43px}}
    @media(max-width:700px){#ssv-widget-hero .ssv-wrap{padding:0 20px}#ssv-widget-hero .ssv-header{min-height:72px}#ssv-widget-hero .ssv-logo{width:185px}#ssv-widget-hero nav,#ssv-widget-hero .ssv-header>.ssv-cta{display:none}.ssv-mobile{display:block!important;border:1px solid var(--ssv-border);background:#fff;border-radius:10px;padding:9px 12px;color:var(--ssv-blue);font-size:20px;line-height:1}#ssv-widget-hero .ssv-hero{display:flex;flex-direction:column;min-height:0}#ssv-widget-hero .ssv-copy{padding:58px 0 46px}#ssv-widget-hero h1{font-size:42px}#ssv-widget-hero .ssv-lede{font-size:17px}#ssv-widget-hero .ssv-visual{width:calc(100% + 40px);min-height:330px;margin-left:-20px}#ssv-widget-hero .ssv-note{right:22px;top:48px;font-size:23px}}
  </style>
  <div class="ssv-wrap">
    <header class="ssv-header">
      <a href="#inicio" aria-label="Seguros de Salud y Vida - Inicio"><img class="ssv-logo" src="/logo-seguros-salud-vida.svg" alt="Seguros de Salud y Vida" /></a>
      <nav aria-label="Navegación principal"><a href="#salud">Salud</a><a href="#vida">Vida</a><a href="#familia">Familia</a><a href="#nosotros">Sobre Nosotros</a><a href="#contacto">Contacto</a></nav>
      <a class="ssv-cta" href="#contacto">Agendar asesoría <span aria-hidden="true">→</span></a>
      <button class="ssv-mobile" type="button" aria-label="Abrir menú">☰</button>
    </header>
    <div class="ssv-hero">
      <div class="ssv-copy"><p class="ssv-eyebrow">Tranquilidad hoy, un mejor mañana</p><h1 id="ssv-widget-hero-title">Seguros que <span>cuidan tu vida.</span></h1><p class="ssv-lede">Protección en salud, vida y más, con el respaldo de una asesoría cercana y personalizada.</p><div class="ssv-actions"><a class="ssv-cta" href="#opciones">Ver nuestras opciones <span aria-hidden="true">→</span></a><a class="ssv-secondary" href="#contacto">Hablar con Lorena <span aria-hidden="true">→</span></a></div></div>
      <div class="ssv-visual" aria-hidden="true"><img class="ssv-family" src="/lorena-profile.png" alt="" /><div class="ssv-note">Vive<br/>tranquilo</div></div>
    </div>
  </div>
</section>
